<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <!-- ===== HEADER AND MENU (shared by every page) ===== -->
  <header class="site">
    <a class="logo" href="{{ '/' | relative_url }}">Rich Riddle <span>| What Are We Doing Here?</span></a>
    <nav class="top" aria-label="Pages">
      <ul>
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %}aria-current="page"{% endif %}>About Me</a></li>
        <li><a href="{{ '/family.html' | relative_url }}" {% if page.url == '/family.html' %}aria-current="page"{% endif %}>Friends &amp; Family</a></li>
        <li><a href="{{ '/portfolio.html' | relative_url }}" {% if page.url == '/portfolio.html' %}aria-current="page"{% endif %}>Portfolio</a></li>
      </ul>
    </nav>
  </header>
  <hr class="rule">

  <main>
{{ content }}
  </main>

  <footer>
    <span>© 2026 Rich Riddle · <a href="https://www.linkedin.com/in/richardriddle" target="_blank" rel="noopener">LinkedIn</a></span>
    <span>Built with help from Claude and ChatGPT.</span>
  </footer>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
